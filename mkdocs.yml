site_name: WellBean Game 기획서
site_description: 모바일 게임 기획 및 개발 문서
site_author: WellBean
docs_dir: docs

theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 라이트 모드로 전환
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - 게임 개요: index.md
  - Lane Defense:
      - 개요: lane-defense/index.md
      - 작업 히스토리: lane-defense/히스토리.md
      - 게임 기획서: lane-defense/기획서.md
      - 적 / 웨이브: lane-defense/적.md
      - 무기: lane-defense/무기.md
      - 상자 시스템: lane-defense/상자.md
  - 운석피하기:
      - 개요: meteor-dodge/index.md
      - 작업 히스토리: meteor-dodge/히스토리.md
  - 운석피하기2:
      - 개요: meteor-dash/index.md
      - 작업 히스토리: meteor-dash/히스토리.md
