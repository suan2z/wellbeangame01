name: Deploy Docs and Game to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs dependencies
        run: pip install -r requirements.txt

      - name: Inject build timestamp & recent commits
        run: |
          BUILD_TIME=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M (KST)')
          find docs -name '*.md' -print0 | xargs -0 sed -i "s/BUILD_TIMESTAMP/${BUILD_TIME}/g"

          python3 - <<'PY'
          import subprocess

          def gitlog(paths):
              try:
                  out = subprocess.check_output(
                      ['git', 'log', '--pretty=- `%h` %s', '-20', '--', *paths]
                  ).decode().strip()
                  return out or '_(아직 변경 이력 없음)_'
              except Exception as e:
                  return f'_(git log 실패: {e})_'

          targets = [
              ('docs/lane-defense/히스토리.md', 'RECENT_COMMITS_LANE',
               ['game', 'docs/lane-defense']),
              ('docs/meteor-dodge/히스토리.md', 'RECENT_COMMITS_METEOR',
               ['docs/meteor-dodge']),
          ]
          for path, token, paths in targets:
              try:
                  with open(path, 'r', encoding='utf-8') as f:
                      text = f.read()
                  text = text.replace(token, gitlog(paths))
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(text)
                  print(f'injected commits into {path}')
              except FileNotFoundError:
                  print(f'skip (not found): {path}')
          PY

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install game dependencies
        working-directory: game
        run: npm ci

      - name: Build game
        working-directory: game
        run: npm run build

      - name: Merge game into site
        run: |
          mkdir -p site/play
          cp -r game/dist/. site/play/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
